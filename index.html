<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Dedeeee 😚💗</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- Awan -->
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<!-- Balon -->
<div class="balloon balloon1"></div>
<div class="balloon balloon2"></div>
<div class="balloon balloon3"></div>

<!-- Halaman Awal -->
<section id="welcome">

    <img src="bubu.gif" class="character">

    <h1>🎉 Kiw Kiw... 🎉</h1>

    <h2>Hari ini ada yang ulang tahun nihhh!!</h2>

    <p>Aku punya hadiah kecil buat kamu 🤍</p>

    <button id="giftBtn">
        🎁 Buka Hadiah Bub
    </button>

</section>

<!-- Kotak Hadiah -->
<section id="giftPage" class="hidden">

    <img src="terompetbubu.gif" class="giftGif">

    <h2>Tadaaa!! 🎉</h2>

    <p>Ini hadiah kecil buat kamu hehe🤍</p>

</section>
<!-- Make a Wish -->
<section id="wishPage" class="hidden">

    <h2>🎂 Make a Wish 🎂</h2>

    <p>
        Sebelum lanjut...
        <br>
        Tulis harapanmu... 
        Semoga semua harapanmu menjadi kenyataan✨
    </p>

    <input
        type="text"
        id="wishInput"
        placeholder="Tulis harapanmu di sini...">

    <br><br>

    <button id="wishBtn">
        💖 Wish Done
    </button>

</section>

<!-- Kue -->
<section id="cakePage" class="hidden">

<div class="cake">

    <div class="plate"></div>

    <div class="layer layer-bottom"></div>

    <div class="layer layer-middle"></div>

    <div class="layer layer-top"></div>

    <div class="icing"></div>

    <div class="drip drip1"></div>
    <div class="drip drip2"></div>
    <div class="drip drip3"></div>

    <div class="candle">
        <div id="flame"></div>
    </div>

</div>

    <h2>Tiup lilinnya dulu yaa 💛</h2>

    <button id="blowBtn">

        💨 Tiup Lilin

    </button>

</section>

<!-- Surat -->
<section id="letterPage" class="hidden">

    <div class="letter">

        <h2>Untuk Nadiaa imut</h2>

        <p id="typing"></p>

    </div>

    <button id="musicBtn">

        ⏸️ Pause Musik

    </button>

</section>
<!-- Audio -->
<audio id="bgMusic">
    <source src="lagu.mp3.mp3" type="audio/mpeg">
</audio>
<!-- Konfeti -->
<canvas id="confetti"></canvas>
<script src="script.js"></script>

</body>
</html>
